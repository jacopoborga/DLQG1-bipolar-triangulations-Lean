    "description": "Lean formalization of 90 numbered definitions and results concerning directed distances in bipolar-oriented triangulations: geometric KMSW maps, Busemann functions and stable limits, Boltzmann and finite-cell distance estimates, half-plane symmetry and local limits, and six Appendix asymptotic/Tauberian lemmas. Explicit source-domain bindings and rendering conventions are recorded. Optional Palomar preparation selects the six Appendix lemmas and seven principal theorems (1.4, 1.6, 1.7, 1.8, 1.11, 1.12, 1.13), all locally validated; Propositions 5.9 and 5.16 remain pending. Six historical official configurations cover eleven distinct paper results at earlier exact commits; the final all-ten configuration preflight is pending. No Palomar intake or registration is claimed.",

name: Lean verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disposable hosted-runner SDK space
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Install pinned elan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ["RUNNER_TEMP"], "elan.tar.gz")
          url = "https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz"
          data = urllib.request.urlopen(url).read()
          expected = "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("elan archive checksum mismatch")
          target.write_bytes(data)
          PYTHON
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install repository toolchain
        shell: bash
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Retrieve required pinned Mathlib artifacts
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib, re, subprocess
          files = [pathlib.Path("DirectedDistances.lean")]
          for directory in ("DirectedDistances", "verification", "Palomar"):
              files.extend(pathlib.Path(directory).rglob("*.lean"))
          modules = set()
          for path in files:
              if not path.is_file():
                  continue
              for match in re.finditer(r"^\s*(?:public\s+|private\s+)?import\s+([A-Za-z0-9_.]+)", path.read_text(), re.MULTILINE):
                  module = match.group(1)
                  if module == "Mathlib":
                      raise SystemExit("An unrestricted Mathlib import requires cache-scope review")
                  if module.startswith("Mathlib."):
                      modules.add(module)
          if not modules:
              raise SystemExit("No explicit Mathlib imports found")
          subprocess.run(["lake", "exe", "cache", "get", *sorted(modules)], check=True)
          PYTHON
      - name: Verify sources, axioms and fresh Lean kernels
        shell: bash
        run: bash scripts/verify.sh
      - name: Check Challenge controls and Solution axioms
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B verification/test_challenge_holes.py
          lake build Palomar.Pilot.Solution Palomar.AppendixA.Solution
          lake env lean -j1 -DrelaxedAutoImplicit=false -DmaxSynthPendingDepth=3 verification/PalomarPilotAxioms.lean > .lake/release-verification/palomar-pilot-axioms.log
          python3 -B scripts/check_release.py --axioms PalomarPilot --log .lake/release-verification/palomar-pilot-axioms.log
          lake env lean -j1 -DrelaxedAutoImplicit=false -DmaxSynthPendingDepth=3 verification/PalomarAppendixAxioms.lean > .lake/release-verification/palomar-appendix-axioms.log
          python3 -B scripts/check_release.py --axioms PalomarAppendix --log .lake/release-verification/palomar-appendix-axioms.log
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-verification-${{ github.sha }}
          path: .lake/release-verification/
          if-no-files-found: warn
          retention-days: 30

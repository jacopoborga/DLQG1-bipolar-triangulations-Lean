name = "DirectedDistances"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DirectedDistances"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "DirectedDistances"

[[lean_lib]]
name = "Palomar"
roots = ["Palomar.Pilot.Challenge", "Palomar.Pilot.Solution", "Palomar.AppendixA.Challenge", "Palomar.AppendixA.Solution", "Palomar.Principal.BoltzmannDistances.Challenge", "Palomar.Principal.BoltzmannDistances.Solution", "Palomar.Principal.CellLDP.Challenge", "Palomar.Principal.CellLDP.Solution", "Palomar.Principal.CellSDP.Challenge", "Palomar.Principal.CellSDP.Solution", "Palomar.Principal.Support.BusemannSource", "Palomar.Principal.Busemann.Challenge", "Palomar.Principal.Busemann.Solution", "Palomar.Principal.Support.BusemannIdentified", "Palomar.Principal.Support.BusemannPaths", "Palomar.Principal.BusemannConvergence.Challenge", "Palomar.Principal.BusemannConvergence.Solution"]
